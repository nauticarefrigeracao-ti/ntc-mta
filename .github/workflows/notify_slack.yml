name: Notificador Slack do SAC

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Serializa: nunca dois notificadores rodando ao mesmo tempo (evita corrida
# entre post_message e o INSERT em slack_notificados -> mensagem duplicada no
# #sac). cancel-in-progress=false: o novo espera o atual terminar, nunca corta
# um envio pela metade.
concurrency:
  group: notify-slack-sac
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Notificar processos novos/atualizados no #sac
        env:
          ML_NEON_URL: ${{ secrets.ML_NEON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python slack_notify.py --once
