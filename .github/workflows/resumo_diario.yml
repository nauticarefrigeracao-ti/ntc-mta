name: Fechamento Diario do SAC

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: resumo-diario-sac
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Fechamento do dia anterior no #sac-fechamento
        env:
          ML_NEON_URL: ${{ secrets.ML_NEON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python slack_notify.py --resumo-diario
